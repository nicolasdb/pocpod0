026-08-11 BOTH OPEN QUESTIONS CLOSED (party-mode + live investigation), story updated. REVOCATION IS AN AUTHORIZATION ACT, NOT A CREDENTIAL ACT: CSS never introspects (@solid/access-token-verifier has NO introspection path at all; verification is offline JWT-signature + DPoP-thumbprint vs JWKS), so deleting a client credential does NOT kill an issued token - it stays valid up to oidc-provider's default 1h AccessTokenTTL, and the IdP's advertised revocation_endpoint is useless against a resource server that never asks. WAC is where revocation IS instant, proven live by 8.9 (tightened access-log/.acl at 14:34 -> same already-authenticated session got 403 on its very next read/write/delete). So AC11 = wacManager.revokeAccess() FIRST, then delete credential, then evict cache. Honest UI copy is "access ends now", never "the key is dead" - for ~1h a revoked identity still AUTHENTICATES and is DENIED everything, which will look like a bug in logs and is not. SECOND ANSWER: resolveIdentity has NO positive-cache eviction surface (identities only ever .set() at mcp-server.js:759; only negativeLookupCache has a TTL) - it must be BUILT, not found; a cached entry serves a live session until process restart. Nicolas's calls: investigate-first on revocation (done, above), and re-mint-supersedes-tombstone (already covered by AC7/Task 1.3). CORRECTION to the redraft's own note: 8.9's VPS deploy is DONE (16:35Z, e2e-verified), so 7.9 inherits working receipts - a post-deploy receipt failure is 7.9's regression, not inherited. LIVE DEFECT FOUND WHILE VERIFYING THE REDRAFT (worse than the known stub): the backoffice "Requests" tab's Allow handler at index.html:1646 is WIRED TO A REAL GRANT - it calls setAgentAccess(guessedUrl, r.webId, {read:true}) on FABRICATED seed requests (index.html:807) whose webIds include https://pod.nicolasdb.eu/teacher-0206/profile/card#me, a WebID on the live pod server - swallows errors with catch(e){} and toasts "X can now read it" unconditionally. So a fake request card on production can grant real read access to a real WebID against a guessed URL and report success even when it fails. AC19 deletes it. Gate scope GONE (7.10 shipped: cookie == CSS-Account-Token, no password anywhere in this flow). GRANT TABLE now AC4 and EXTENDED beyond epics.md:372 - it adds grantUri + reserved-nullable purpose/scope/excluded/consequenceOfRefusal mirroring poc:ConsentGrant (Story 5.5, shipped) on the MIGRATION-WINDOW argument from sprint-change-proposal-2026-08-11-consent-loop.md: adding fields to a table being designed is a field list, adding them to a table already holding live minted credentials is a migration, and 8.9 proved a use cannot be linked to its justification after the fact (timestamp correlation is a guess). grantUri is what will eventually populate receipt.js's underGrant, which is null today - cross-referenced both directions. HARD FENCE written into the story: 7.9 does NOT build request intake, does NOT mint ConsentGrant resources, does NOT add an approval step, does NOT populate underGrant - those are consent-loop items 3/4, undrafted stories. REVOCATION is now a first-class AC (AC10, list+revoke on the same screen as mint) with immediate cache eviction (AC11) - a mint button with no revoke ships the leak with no exit. Revocation designed as a TOMBSTONE (poc:revokedAt pattern), which surfaced a NEW fail-fast hazard the briefs did not anticipate: a revoked row's CSS credential is deleted, so bootIdentities() would fail login on it and process.exit(1) - AC7 requires boot, resolveIdentity and the duplicate-webId/clientId checks to ALL skip revoked rows, or the file that records a revocation becomes the file that refuses to boot, and re-minting for the same WebID would be permanently refused. expiresAt GATED (AC12): ships only with warn-before-the-wall + one-action renewal + named on the onboarding page, else ships as null on every grant - "ship it as null" is declared an acceptable outcome, a silent half-implementation is not. Per-slug attribution absorbed from 8.9 as grantId (AC13) - explicitly NOT the slug: receipts land in the DATA SUBJECT's pod (BP-1), so writing the slug there hands a third party a working bearer credential in the very artifact designed to be shown to third parties. Fabricated "Requests" tab REMOVAL accepted into this story (AC19) with rationale: it is minutes of deletion, it sits on the exact screen this story turns into a real grants list, and its real intake is an undrafted story - all removal sites enumerated (index.html:672-694, :807, :1525, :1642-1647, :1682-1686). Backward compat with pre-7.9 entries is its own AC (AC5). Every deferred item now names where it goes. 22 ACs, 8 tasks. Surviving unchanged from the 08-03 draft: atomic-write/fail-fast validation, orphan-credential revoke-on-write-failure, pod.nicolasdb.eu/onboard/ routing (connector vhost is IP-allowlisted, browsers get 403), SQLite deferral (NEVER Supabase). Note carried into Task 6.5: 8.9's VPS deploy is still outstanding, so receipts fail quietly until this story's deploy runs. 2026-08-03 NEEDS REDRAFT after party-mode review (sprint-change-proposal-2026-08-03.md). Trigger: Nicolas reported he NEVER uses the 7.4 credentials UI - he signs OUT of the backoffice, re-authorizes, and clicks CSS stock "Edit account" instead, because the unlock gate charges a password for the wrong thing (tokens, not pods). REDRAFT MUST: (a) DROP the account-token/unlock-gate scope entirely - it moves to Story 7.10, which kills the gate outright (CSS account cookie and CSS-Account-Token are THE SAME VALUE, ResolveLoginHandler.js:35-36, and the backoffice is same-origin so the browser already holds it); (b) add a hard DEPENDENCY on 7.10 for both the account session AND pod creation - as drafted, 7.9 automates 8.7 walkthrough steps (d)-(f) while (b)-(c) still force the user out of the product entirely, i.e. it is a button in the middle of a broken flow; (c) simplify AC9 - the account-token delegation still exists (the mint must stay server-side to keep clientSecret out of the browser) but the person no longer re-types a password to create it, so the trust conversation gets honest instead of theatrical. EVERYTHING ELSE IN THE DRAFT STANDS and must survive the redraft. 2026-08-03: STORY DRAFTED (7-9-backoffice-minted-credentials.md). Three findings the epic sketch did not anticipate, all now settled in the story: (1) the "boot-time singleton" blocker is ALREADY RESOLVED by 8.6.1's lazy loading - do NOT build a reload path or a restart step; (2) the backoffice has NO server side at all (4 static files served by CSS's StaticAssetHandler via infra/css/config.json), so the endpoint has to live in mcp-connector, which is also the only process that can safely write identities.json; (3) the connector's own vhost solid-mcp.nicolasdb.eu is IP-allowlisted to Anthropic's outbound range + the host, so a teammate's BROWSER gets 403 - the endpoint must be routed via pod.nicolasdb.eu/onboard/ (same origin as the backoffice = no CORS, and no cert expansion since pod. is already on the multi-SAN cert). HIGHEST-SEVERITY REQUIREMENT is AC4/Task 1: bootIdentities() is fail-fast (process.exit(1) on any bad identity), so ONE bad written entry bricks the connector for EVERYONE at next restart - the write path must validate the MERGED file with the same rules loadIdentities uses, write atomically (temp+rename), and verify mode 600 after. SQLite migration DEFERRED with rationale (identityRegistry's duplicate-key detection works on raw JSON text and cannot be reproduced post-parse; would discard tested guards for a scale problem that doesn't exist at N=3). NEVER Supabase. Orphan-credential path found and given an explicit revoke step: CSS returns clientSecret exactly once, so mint-success + write-failure strands a live credential nobody holds (Epic 7 orphan-account precedent). Secrets-never-in-browser resolved as: browser does accountLogin (email+pw -> CSS-Account-Token), hands THAT to the server, server mints + writes + returns only {connectorUrl, podRootUrl} - the account-token delegation is a real trust boundary and AC9 requires the UI to say so honestly. Watch the 7.4 content-type trap: the authed GET /.account/ must carry NO content-type header or CSS returns a controls-less body and clientCredentials comes back undefined (looks like "the endpoint doesn't exist"). Two repos deploy here - pocpod0 for app code, hetzner-gateway for the one new nginx location block; run git status in hetzner-gateway FIRST (rsync --delete-after removes live vhosts that are merely missing locally). 2026-08-02: drafted in epics.md during the 8.7 design session. One-button connector credentials: server-side mint against CSS account API using the person's OWN session, writes the identity entry, returns the connector URL once (7.4 one-time-secret UX). Secrets NEVER through the browser. Collapses 8.7 walkthrough steps 4-6. Store moves JSON -> SQLite here (NEVER Supabase: it would put every AGENT clientSecret on third-party infra). Boot-singleton blocker resolved separately by Story 8.6.1. See epics.md.
  story-7-10-account-and-pod-lifecycle: done  # 2026-08-03 code review complete (3-layer): 6 patches applied (countDescendants excludes protected resources from AC9's count; pods section now gated on credsUnlocked/credsSignedOut like credentials, AC2; _accountControls distinguishes 401-SESSION_EXPIRED from other HTTP errors; delete-ceremony Close button hidden during busy stage since it doesn't abort in-flight deletion; podOwned optimistically seeds the active pod as owned to avoid a flash; wiping the active pod now resets an open editor view), 1 deferred (isOwnedPod's getAccess-throws assumption, logged in deferred-work.md). 2026-08-03 DRAFTED -> 7-10-account-and-pod-lifecycle.md (17 ACs, 9 tasks). Context built by re-reading CSS v7.1.9 source + config ON THE LIVE CONTAINER and probing the live pods, which INVALIDATED TWO PLANNING CLAIMS the epic bullet asserts. (1) "CSS's stock README has no extension, reads as text, says nothing" is WRONG: the template is templates/pod/base/README$.md.hbs - the $.md suffix IS CSS's content-type convention, so a stock README is served text/markdown ~1001 bytes with a full welcome page (chabivdb/README on the live server proves it). What produced the "says nothing" impression was two DIFFERENT real bugs: our kindOf() classifies by filename extension only (README has none -> labelled "text" whatever its content-type), and hyperscope_ndb/README is 220 bytes of text/plain because Nicolas overwrote it through the backoffice, whose writeText() defaults to text/plain (a content-type downgrade on edit). Real gap = the stock copy is Solid-jargon-heavy and not our voice. (2) "empty pod name claims the site root" (the 7.1 incident lesson) NO LONGER HOLDS as stated: config/identity/handler/routing/pod/create.json sets allowRoot:false, which makes CreatePodHandler's yup schema mark name required (.trim().min(1)) - an empty name is refused by validation. The root-claim path still exists in BasePodCreator (overwrite = !input.name) guarded ONLY by that flag, so the client-side guard stays as defense in depth, but do not tell the user the server is unguarded. Finding 1 (gate removal) is now source-verified from BOTH ends, not just the login handler: ResolveLoginHandler.js:35-36 generates the value, CookieMetadataWriter.js:39-42 serialises it as Set-Cookie css-account Path=/ SameSite=Lax (deliberately NOT HttpOnly, NOT Secure), AND AuthorizationParser maps the CSS-Account-Token scheme onto the SAME metadata term - cookie and header are interchangeable, TTL 14 days, refreshed on use. Backoffice is same-origin (StaticAssetHandler, config.json:94-119) so credentials:'include' suffices. Finding 3 confirmed live: alex/ chabivdb/ hyperscope_ndb/ pod roots ALL return 200 anonymously, while .acl returns 401 and profile/card returns 200. Also captured from source: GET controls.account.pod returns {pods:{baseUrl:podResource}} (free pod-list for the UI), duplicate name -> 409 ConflictHttpError and names are SERVER-GLOBAL, and BasePodStore has no delete route at all (confirming the 404/400 live probes). NEW AC beyond the epic bullets: AC2 - the cookie can be absent or past its 14-day TTL while the OIDC pod session is still alive (restorePreviousSession), so gate removal MUST degrade to an honest "sign in to CSS" state and must never silently render an empty pod list or reintroduce a password field. Task 1 is a NET CODE DELETION. Three open questions handed to Nicolas non-blocking (root-row placement; whether pod delete removes profile/card last or refuses; build-now-vs-defer on the operator AccountStore cascade). Scope fences: effective-access resolver + "inherits from parent" answer = 7.11, export = 7.5, credential minting = 7.9, _writeAcl/_saveAclOrThrowControlError duplication stays logged not fixed. # 2026-08-03 NEW, absorbs 7.7 (sprint-change-proposal-2026-08-03.md). RUNS FIRST in Epic 7 - unblocks 7.9. Six pieces, internally sequenced: (1) KILL THE UNLOCK GATE - VERIFIED in CSS source that ResolveLoginHandler.js:35-36 emits ONE cookieStore.generate(accountId) value as BOTH the account cookie AND the json.authorization CSS-Account-Token, and the backoffice is served same-origin from pod.nicolasdb.eu root, so the browser ALREADY HOLDS IT. Delete accountLogin(email,password) + the "Unlock app management" prompt; read authed /.account/ with credentials:include. NET CODE DELETION. TRAP: that GET must carry NO content-type header or CSS content-negotiates a controls-less body and clientCredentials comes back undefined (7.4 live finding, looks like "the endpoint does not exist"). (2) CREATE A POD from the backoffice via controls.account.pod - pod names collide GLOBALLY across the instance, not per-account, refused 409 Conflict (verified TemplatedPodGenerator.generate 2026-08-03); surface as name-availability, not a raw error. (3) POD-ROOT ACL AS A REAL ROW - CSS pod template grants foaf:Agent acl:Read on <./> with NO acl:default, so the pod root is publicly LISTABLE while children are not, and My things has no row for it at all. This is the "where do I set top pod permissions?" gap. NOTE the backoffice footer "New things start private" is CORRECT and must stay - public has accessTo but no default, so it never propagates. (4) PROTECTED-RESOURCE GUARDRAILS - profile/card IS the WebID document (CSS template comment: required for discovery and verification); deleting it breaks OIDC login and orphans every .acl naming that WebID, no versioning, no undo - yet it renders with the same trash affordance as a throwaway note. Explain what breaks, do not just add a scary modal. (5) DELETE A POD, absorbed from 7.7 unchanged. (6) WELCOMING README - override CSS stock README (no extension, renders as "text", says nothing) with README.md; LOCKSTEP: README.acl.hbs hardcodes acl:accessTo <./README>, so renaming without overriding it in the same change silently strips the public ACL off the welcome file. Same bind-mount mechanism as 7.2. WCAG 2.1 AA.
