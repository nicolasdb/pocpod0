  story-8-3-per-person-endpoints: done  # 2026-07-31: code review complete (3-layer blind/edge/acceptance). One auditor finding REJECTED as a false positive: it claimed AC3's per-identity WebID boot log was missing because bootIdentities() only logs on failure — but auth.js:65 logs "authenticated as <webId>" on every getAgentSession() call, so N identities already emit N lines; the auditor never read the layer below mcp-server.js. 2 decisions resolved with Nicolas: (a) slug floor raised 16->22 — AC6 says >=22 and gen-slug.js emits exactly 22, but validation accepted 16 behind an invented "older scheme" comment (8.3 is the FIRST story with slugs, so the rationale was fabricated); not an exploitability issue (95 vs 131 bits both unbruteforceable) but a spec-fidelity/honest-comment one, and validation now matches generation exactly; (b) boot log now names the label, since auth.js's line carries no label and N identities were distinguishable only by eyeballing WebIDs. 4 more patches: bare /mcp and /mcp/ now return the same generic JSON-RPC 404 as unknown slugs (both previously fell through to Express's HTML 404 — a DIFFERENT response shape is itself a signal, contra AC4); "_comment" skip now warns instead of silently dropping an identity (was reintroducing the exact silent-drop findDuplicateTopLevelKeys exists to prevent); non-object top-level JSON rejected (the dup-key tokenizer tracks {} but not [], so an array-shaped file corrupted detection — rejecting the undocumented shape closes it without rewriting the tokenizer); verify-isolation.js rejects slugA===slugB (same slug twice ran both halves as ONE identity and printed ALL CHECKS PASSED having proven nothing — a vacuous pass on the story's central claim). 8 deferred to deferred-work.md (timing-unsafe Map.get on bearer-secret slugs, fail-fast single-point-of-failure, no cross-slug webId/clientId uniqueness check, no chmod-600 enforcement, sequential boot w/o timeout, unrate-limited 404 log-write disk-fill, WebID strict-equality w/o URI normalization, SOLID_OIDC_ISSUER unvalidated). 3 dismissed. Verification: node --check clean on 4 touched files + direct loadIdentities() unit-check 13/13 (22 accepted, 21 and 16 rejected, non-URL-safe, missing field, dup key, array/string/null top-level, _comment cases, invalid JSON); gen-slug.js re-confirmed at exactly 22 URL-safe chars. POST-PATCH LIVE RE-VERIFICATION DONE 2026-07-31: booted server locally against pod.nicolasdb.eu w/ one fresh identity, confirmed all 6 patches hold live (byte-identical 404 on bare /mcp, /mcp/ empty-slug, and unknown-slug; per-identity+label boot log lines present — direct disproof of the auditor's AC3 false-positive; AC7 log grep clean of slug/clientId/secret/bearer/token; verify-isolation.js's new slugA===slugB guard exits 1), re-ran verify-http.js (ALL CHECKS PASSED, 7 tools), cross-checked VPS directly via ssh hetzner (throwaway's clientCredentials confirmed empty/revoked, account shell confirmed persisting as documented; account-record count read as 27 via direct file listing vs 29 noted elsewhere — reconciliation item, not a defect). AC5 isolation accepted as-is (Nicolas's call) rather than re-run live: the original throwaway's credentials are revoked and its password was never recorded so it can't be reused, and minting a second throwaway would breach the story's own single-throwaway-footprint scope with no HTTP delete until 7.7; none of the 6 patches touch the slug->session binding or tool layer the isolation proof exercises. Deferred to 8.4 where a 2nd identity exists anyway. State cleaned up after (process killed, identities.json deleted, no untracked files left). # 2026-07-31: implemented and live-verified. mcp-server.js now boots N Solid sessions at startup (one per identities.json entry, fail-fast naming the failing label) and routes POST /mcp/<slug> to the matching identity's session; bare /mcp removed (decision recorded in Dev Notes — keeping it would be the shared-identity endpoint this story ex