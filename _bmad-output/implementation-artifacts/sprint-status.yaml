ists to eliminate). New identityRegistry.js validates the gitignored identities.json (duplicate-key/missing-field/weak-slug rejection); identities.example.json committed as the placeholder template; scripts/gen-slug.js wired as `npm run slug` (CSPRNG, 22 URL-safe chars). Unknown slug -> generic 404, no slug/secret ever logged (grep-confirmed on a real boot log). Live-verified: (1) single real identity boot + verify-http.js against /mcp/<slug> — all 7 tools + one tools/call passed; (2) provisioned a throwaway CSS account+pod end-to-end via the full HTTP flow (create account -> register password login -> create pod -> mint client credentials), configured as a second identity, and ran new scripts/verify-isolation.js: identity B read/wrote its own private resource, identity A was DENIED on that same resource with 8.2's documented error text (not a stack trace), then confirmed A still reaches its own resources. Throwaway's client credentials revoked afterward (DELETE -> 200, confirmed gone via 404); the account/pod shell itself has no HTTP delete path (known CSS gap, Story 7.7's job). Added one check beyond the literal tasks: post-login webId is verified against config and fails fast on mismatch (caught a real dotenv-`#`-truncation test-fixture bug during this session). README updated (per-person scheme, add/remove/rotate, verify-isolation command, 8.4 forward-note on nginx logs capturing slugs). Epic 8 action log appended + progress-report.md Story 8.3 section added, per convention. wacManager.js/podClient.js/auth.js untouched. Moved to review.
  story-8-4-vps-deploy-hardening: done  # 2026-08-01: code review complete (3-layer, Tasks 3-9 diff) — 4 decisions resolved w/ Nicolas (2 dismissed: shared-IP rate-limit bucket, internal-network XFF bypass both accepted as by-design; 2 promoted to patches: unknown-slug limiter header leak, /healthz try/catch), 6 patches applied (/healthz empty-identities false-healthy fix, env-var NaN validation on rate-limit/timeout/journal-rotation configs, GET/DELETE now hit the tight unknown-slug limiter, gosu Dockerfile install pinned to a versioned binary download — NOT build-verified, no container runtime in review sandbox, verify via make vps-build before next deploy — plus the two promoted patches), 3 deferred (journal rotation non-atomicity, entrypoint chown running every restart not just first boot, nginx-side changes living in the separate hetzner-gateway repo unreviewable from this diff), 9 dismissed as noise/spec-compliant. Moved to done. # 2026-07-31: drafted from brief T4/T5 + a LIVE VPS probe (ssh hetzner) that invalidated five planning assumptions. (1) mcp-connector is not on the VPS at all — the repo copy there is stale (2026-07-23, pre-Epic-8), so nothing is deployed and there is no deploy path yet. (2) The nginx config lives in a SEPARATE repo (~/github/hetzner-gateway -> /home/nicolas/hetzner-gateway) with its own `make vps-deploy`; this story spans two repos and two deploy commands, and nobody will find the vhost by looking in pocpod0/infra/. (3) The TLS cert is MULTI-SAN, not wildcard (claw/n8n/nicolasdb.eu/pgadmin/pod/portainer/smartflow) issued via certbot manual + Cloudflare DNS-01 hooks — mcp.nicolasdb.eu needs a cert EXPANSION, and five production sites share that cert so a botched renewal config is a delayed multi-site outage. (4) mcp.nicolasdb.eu DNS is NXDOMAIN — the A record must exist before DNS-01 validation. (5) UFW only opens 22/80/443/9443, so the Anthropic allowlist CANNOT be a firewall rule (443 is shared with pod.nicolasdb.eu + 4 vhosts); it must be per-server-block in nginx. Anthropic's range re-confirmed from source: allowlist the OUTBOUND 160.79.104.0/21, NOT the inbound /23 (and the five 34.162.x.x/32 addresses are phased out). express-rate-limit found already locked at 8.6.1 as a transitive dep of SDK 1.30.0 — promote to explicit, don't reinstall. Three decisions taken with Nicolas: (a) docker compose service over brief T4's systemd — no host node/npm exists, every other service is a container, nginx already routes by container name, and it matches architecture.md's own INFRA-2; recorded as a documented brief deviation. (b) Strict public allowlist (Anthropic + operator, deny all) PLUS an internal gateway-network path — Nicolas flagged that Hermes/other bots need the connector, but hermes is a container on the SAME Docker host, so it joins the `gateway` network and hits mcp-connector:3939 directly, bypassing nginx/TLS/allowlist/access-log entirely; AC6 requires proving that path, not asserting it. (c) Local JSONL audit journal on a named volume (never the slug, only the label), with a stated size bound. Two new hardening items the probe surfaced: nginx logs have NO rotation on this host (access.log 48MB, mapsofmaking 80MB, disk at 73%), which turns 8.3's forward-flagged "slugs land in the URL path so nginx logs capture them" from a temporary leak into a PERMANENT credential store and makes 8.3's unrate-limited 404 log-write a real disk-fill vector; and `make vps-push`'s `rsync --delete-after` has no exclusion for identities.json, so a VPS-side secrets file gets deleted by the next push, taking the whole team's access down during an unrelated deploy. Also carries the explicit re-verification 8.3's review deferred here (verify-isolation.js with two identities — needs a NEW throwaway, the 8.3 one's credentials were revoked and its password never recorded) and forces a decision on 8.2's twice-deferred /healthz session-liveness gap plus its session-expiry/body-cap/timeout items. VPS RAM is at 187MB available of 3819MB — set a memory limit and measure real RSS rather than assuming headroom. # 2026-08-01: Task 6 (audit journal, AC7) implemented and LIVE-VERIFIED. New src/journal.js appends JSONL (ts/label/tool/resource/outcome, never the slug/secret) to the mcp-audit named volume, 10MiB+1-backup rotation bound; mcp-server.js's safeHandler now takes (toolName, label, resourceKey, fn) and classifies outcome (denied on 403 or isError-without-throw, error otherwise, ok otherwise). LIVE BUG found+fixed: the mcp-audit named volume is created root-owned by Docker, so every write silently EACCES'd against the non-root `node` container user — fixed durably (not a one-off chown) via new entrypoint.sh + gosu (Dockerfile), which chowns the volume as root then drops to node before exec, self-healing on every boot; proved by resetting the live volume to root ownership and confirming the next deploy fixed it. Verified against the live production connector via the real "Nicolas (agent)" identity (no throwaway needed): solid_list_container -> ok, solid_write_resource to an unauthorized resource -> denied, solid_read_resource on a nonexistent resource -> error; all three outcomes distinguishable in the resulting journal, 0 grep hits for the slug or any secret term. verify-http.js re-run against the live endpoint post-change, ALL CHECKS PASSED (no regression). Two live VPS deploys required (make vps-deploy, confirmed with Nicolas both times) — first for the journal code, second for the entrypoint fix. Story resumes at Task 7 (health semantics decision, AC8). # 2026-08-01: Task 7 (AC8) decided and LIVE-VERIFIED. /healthz is now session-aware: aggregate boolean over every configured identity's session.info.isLoggedIn (200 {ok:true} iff all alive, 503 {ok:false} if any dead) — closes the gap 8.2 and 8.3 both deferred, without a live CSS round-trip per 15s poll. Aggregate-only by construction (every()), so no per-identity/WebID/count leak is even possible. Unit-checked both branches with mocked identity maps before touching prod; deployed (3rd vps-deploy this story, confirmed with Nicolas) and confirmed live: internal call from inside the container (correct Host header) against the one real identity -> 200 {"ok":true}, no WebID/count in body; Docker's own compose healthcheck (same endpoint) reports the container healthy post-deploy with no config change needed. Story resumes at Task 8 (verify deployed state through the public URL, AC10). # 2026-08-01: Task 8 (AC10) DONE, all four subtasks live-verified through the PUBLIC HTTPS URL. Run from the VPS shell / inside the container, not the dev sandbox — Task 5.1's allowlist excludes roaming addresses (sandbox gets 403), while on-host requests to the public hostname hairpin through the host's own allowlisted public IP, so these are genuine TLS+nginx+allowlist+rate-limit round trips, not loopback shortcuts. 8.1: ALLOWED_HOSTS verified BEHAVIOURALLY not by reading the env var — Host: evil.example.com rejected 403 "Invalid Host", proving DNS-rebinding protection is armed despite the 0.0.0.0 bind. 8.2: verify-http.js against https://solid-mcp.nicolasdb.eu/mcp/<slug> -> initialize OK, 7 tools, live tools/call returning a real listing, ALL CHECKS PASSED. 8.3: GET/DELETE -> 405; unknown slug + bare /mcp + /mcp/ -> 404, and byte-identity PROVED BY MD5 (all three 0177d4e7908504d65d5375d7f7568e96) rather than eyeballed, since same-looking bodies can still differ by a trailing byte; /healthz -> 200 {"ok":true}, no WebID/count. 8.4: verify-isolation.js re-run with two real identities over the public URL, closing the AC5 re-verification 8.3's review deferred here — provisioned exactly one budgeted throwaway (mcp84iso) via the full HTTP account API, A correctly DENIED on B's private resource with 8.2's documented wording while still reaching its own resources, ALL CHECKS PASSED. Unplanned AC7 cross-evidence: the audit journal independently recorded the whole isolation test, attributing each call to the correct identity