  story-8-6-capture-surface-and-skill: done  # 2026-08-02: Code review passed — 1 decision (isForeignResource fail-open on malformed webId, resolved: now logs to journal instead of silently skipping receipts forever), 2 patches (multi-byte UTF-8 codepoint slicing in overwrite-ceremony preview text; receipt-latency documented in tool description + skill), 4 deferred (container-delete TOCTOU, uncoordinated reauth race, stale appendFile byte-count under race, confirmGone idempotency) — all same class as pre-existing accepted concurrency limitations (Story 7.3 scope). node --check clean on all touched files. ALL 11 ACs MET WITH LIVE EVIDENCE, Task 7 closed (epic-8-action-log.md appended live w/ byte-growth verification, progress-report.md Story 8.6 section added, deferred-work.md's deleteResource item struck CLOSED + new /healthz-staleness item added). Nicolas confirmed native approval UI fired on both overwrite and delete (AC5 fully met). Task 5 run LIVE from claude.ai by Nicolas (transcript in _bmad-output/test-artifacts/), closing 5b.4/5b.8 alongside it. AC2 (byte-exact append math), AC7 (round trip — file-location cold, pod-root warm via project instructions, caveat noted), AC5 ceremony text all PASS. TWO REAL BUGS found+fixed+redeployed mid-session: (1) toToolErrorResult's 409 branch discarded solid_delete_resource's specific non-empty-container message for a generic "Conflict" string; (2) read-receipt writes had no path to safeHandler's one-shot reauth-on-401 retry (own try/catch caught 401s locally so a stale long-running session's receipt write failed permanently) — root-caused via direct server-side repro (fresh login against the identical grant worked instantly), disproving the claude.ai agent's own incorrect "receipts not implemented" conclusion (journal showed the attempt firing on every cross-pod read from the start). Live deviation from design intent, not a defect: access-log/ grant is RW not Append-only, because Epic 7's backoffice UI has no Append-only/i