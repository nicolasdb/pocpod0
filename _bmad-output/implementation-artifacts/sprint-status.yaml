  story-7-12-agent-identity-lifecycle: done  # 2026-08-20 Closed to done: Task 6.1-6.3 verified live, 6.4 deliberately deferred by Nicolas as non-blocking, code review complete (7 patches applied, 7 deferred, 1 decision resolved). 2026-08-19 Tasks 1-5 implemented (createAgentIdentity/listWebIdLinks/unlinkWebId in backoffice/pod-api.js + DemoBackend parity, "Agent identities" UI in backoffice/index.html, corrected mint gate — accountControlsWebId() now checks controls.account.webId link membership not pod-prefix — in mcp-connector/src/onboardRouter.js verified offline via scripts/verify-mint-gate.js, docs updated in team-onboarding.md + mcp-connector/README.md). Deployed to VPS (make vps-deploy) — mcp-connector rebuilt/restarted clean, both existing identities (nicolas_claude, claude-alex) authenticate with no boot error, /onboard/grants reachable via pod.nicolasdb.eu. Task 6's remaining live sub-steps (create hermes-manny via the real browser UI, mint/unlink live, confirm grantId attribution) need Nicolas's own browser session as the pod owner — no browser tool or account password available to the dev session. Story Status left at in-progress, not review, until those close. controls.account.webId's exact wire shape (list-map keyed by resource URL) was implemented per the story's own recorded contract, not independently re-verified against CSS source (no local source/container) — Task 6.1 is its first live confirmation. 2026-08-19 Marked ready-for-dev by Nicolas, overriding the "competes with 7.11a" sequencing note below — dev-story starting now. 2026-08-19 DRAFTED from a live CSS investigation triggered by "must every agent get its own pod?". Answer: NO — WebID:Pod is n:1, not 1:1. CSS keeps TWO INDEPENDENT registrations that were being conflated: webIdLink (WebID->Account, gates credential minting via isLinked) and pod owner (WebID->Pod, full Control over everything). LinkWebIdHandler links any WebID under a pod your account created with NO ownership challenge, so 