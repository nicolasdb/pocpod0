WRONG and corrected it in epics.md: the tamper question is NOT open - Story 8.6 already recorded live (8-6:109,212,219) that the access-log/ grant is RW not Append-only, and docs/team-onboarding.md already discloses it. THE REAL QUESTION IS HARDER: podClient.appendFile is a READ-THEN-OVERWRITE (getFile + overwriteFile, podClient.js:73-90), so the receipt path structurally needs Read+Write - granting acl:Append alone would BREAK receipts, not tighten them. Grant and write path must move together. 3 candidate paths (POST-per-receipt into the container / RDF receipts + insert-only N3 PATCH / keep RW and say so honestly - path C is a legitimate outcome). Also found: wacManager.grantAccess() already accepts append:true, so the Epic 7 backoffice UI gap blocked the SELF-SERVICE path, not the capability - 8.6's attribution to "7.6/7.8 scope" was too pessimistic. DOC DEFECT the 08-11 resequence created: team-onboarding.md + SKILL.md promise Append-only "once 7.6/7.8 lands" and BOTH are now deferred post-PoC - a promise against unscheduled work on the one page whose purpose is honesty. Must be fixed whatever the technical decision.  # 2026-08-11 SPLIT same day it was created (party-mode review), and RENAMED from story-8-9-access-journal-as-control. RUNS FIRST in the new order - it is minutes of work and 7.9 rewrites the same grant model, so verify before 7.9 inherits an unexamined assumption. SCOPE NOW = ONE QUESTION, still a HYPOTHESIS not a confirmed defect: is the agent WebID's effective grant on access-log/ genuinely Append-without-Write? Brief §15 verified leaf-container scoping on shared/ but access-log/ sits at POD ROOT and was never covered by that check. Probe = attempt PUT/overwrite on receipts.jsonl with the AGENT credential, expect 403; confirm append still succeeds. Both outcomes cheap (holds -> record evidence, 8.7 can say verified not assumed; cascades Write -> fix the grant, re-probe). ATTRIBUTION (per-slug in each entry) MOVED to Story 7.9 where the slug<->id