  story-8-8-credential-at-rest-hardening: deferred-pre-pilot  # 2026-08-11 DEFERRED same day it was created (party-mode review). RISK ACCEPTED for the PoC - architecture.md SEC-4 now records the acceptance with a dated rationale rather than an open gap. Nicolas's input: VPS access is SSH-KEY ONLY and he holds the SOLE key (no password auth, no other key holder, no shared operator account); the only data at risk today is his own. Remediation is disproportionate now: LUKS on a running Hetzner root fs = rebuild-and-migrate, and the app-side hash alternative may need an upstream fork whose feasibility is itself unknown. Contribution to the newcomer journey: ZERO. NOT DROPPED - GATE: drafted when the first non-Nicolas person's REAL DATA lands on the VPS (custody of someone else's data is what changes the calculus).  # original entry: from brief §16. FINDING (not a reserve cleared): CSS client-credentials secrets are plaintext on an unencrypted disk, TWO layers, verified in source on the live host. (a) BaseClientCredentialsStore.js declares schema `secret: 'string'` - no hash field, no digest, no bcrypt/argon2 import - and create() hands randomBytes(64).toString('hex') straight to storage.create(). (b) sda1 is plain ext4, `cryptsetup status` shows no mapped device, no LUKS. Neither mitigates the other: host/root access or a volume snapshot yields live secrets directly, no cracking. NOT a pocpod0 defect - it is the upstream OIDC library convention inherited by CSS, so this story decides what we do about a dependency's property, it does not fix our bug. SCOPE IS WIDER THAN THE SLUG SCHEME: any CSS client-credentials secret inherits this INCLUDING the server-side DPoP token an OAuth migration would hold, so do not scope it as slug-era cleanup. MUST CLOSE AN OPEN UNKNOWN BEFORE IMPLEMENTING: is an app-side hash/KDF even compatible with CSS's client-credentials flow, or does verification need the plaintext secret on hand? If it needs an upstream fork/patch, that cost is the deciding input. DECIDE AND RECORD THE LAYER: disk LUKS (deployment-only, contract intact, protects a stolen image but not a live root) vs app-side hash (protects against live root, breaks the library contract) - not necessarily either/or, and "accept the risk" is a valid recorded outcome. DONE means architecture.md SEC-4 no longer says "not yet closed". Honest boundary the story must state: at-rest protection is not protection from a live compromised host.
  story-8-9-access-journal-tamper-spike: done  # 2026-08-12 CODE REVIEW COMPLETE (3-layer): AC7 decision resolved (8-7-team-onboarding-doc.md honest-boundaries text was still forward-looking, contradicting the already-corrected docs/team-onboarding.md — fixed to state Append-only as verified live). 6 patches applied to podClient.js/receipt.js/probe-append-only.js/verify-receipt-appendonly.js (Location header origin validation + malformed-Location handling, slug header control-char guard, error body truncation, underGrant undefined-only coercion, probe podRoot fallback guard, null-Location crash guard) — node --check passed on all four. 5 deferred (receiptSlug collision window, probe teardown best-effort, postResource inherited-ACL assertion, Makefile audit/ exclude evidence gap, production ACL-tightening path unclear) — logged in deferred-work.md. 4 dismissed as noise. Moved to done.  # 2026-08-11 SPIKE DONE, live-verified. ANSWER: the journal WAS rewritable by the agent that writes it - PUT of its own bytes returned 205 and mtime moved, not theoretical. PROVENANCE CORRECTED: access-log/ carries its OWN .acl and pod root grants the agent NOTHING, so no Write ever cascaded - the RW was an explicit leaf grant. APPEND-ONLY IS REACHABLE (8/8 live on a scratch container in the AGENT's own pod, so Story 8.1 AC4's no-Control-on-data-pods guarantee was never weakened): Path A POST->201 with PUT/GET/DELETE on existing children denied; Path B insert-only N3 PATCH->205 with deleting PATCH denied. wacManager.grantAccess({append:true}) authors it end-to-end -> the Epic 7 backoffice gap blocked SELF-SERVICE only, downgrading the 7.6/7.11b deferral from "blocks Append-only" to "makes it a scripted step". DECISION: Path A - podClient.postResource() added, receipt.js POSTs one JSON receipt per read with a reserved underGrant field, live access-log/ grant tightened to acl:Append (old ACL kept at .acl.bak-8-9). Regression 7/7 before AND after: agent now denied listing, read-back, over