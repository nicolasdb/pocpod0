able of 3819MB — set a memory limit and measure real RSS rather than assuming headroom. # 2026-08-01: Task 6 (audit journal, AC7) implemented and LIVE-VERIFIED. New src/journal.js appends JSONL (ts/label/tool/resource/outcome, never the slug/secret) to the mcp-audit named volume, 10MiB+1-backup rotation bound; mcp-server.js's safeHandler now takes (toolName, label, resourceKey, fn) and classifies outcome (denied on 403 or isError-without-throw, error otherwise, ok otherwise). LIVE BUG found+fixed: the mcp-audit named volume is created root-owned by Docker, so every write silently EACCES'd against the non-root `node` container user — fixed durably (not a one-off chown) via new entrypoint.sh + gosu (Dockerfile), which chowns the volume as root then drops to node before exec, self-healing on every boot; proved by resetting the live volume to root ownership and confirming the next deploy fixed it. Verified against the live production connector via the real "Nicolas (agent)" identity (no throwaway needed): solid_list_container -> ok, solid_write_resource to an unauthorized resource -> denied, solid_read_resource on a nonexistent resource -> error; all three outcomes distinguishable in the resulting journal, 0 grep hits for the slug or any secret term. verify-http.js re-run against the live endpoint post-change, ALL CHECKS PASSED (no regression). Two live VPS deploys required (make vps-deploy, confirmed with Nicolas both times) — first for the journal code, second for the entrypoint fix. Story resumes at Task 7 (health semantics decision, AC8). # 2026-08-01: Task 7 (AC8) decided and LIVE-VERIFIED. /healthz is now session-aware: aggregate boolean over every configured identity's session.info.isLoggedIn (200 {ok:true} iff all alive, 503 {ok:false} if any dead) — closes the gap 8.2 and 8.3 both deferred, without a live CSS round-trip per 15s poll. Aggregate-only by construction (every()), so no per-identity/WebID/count leak is even possible. Unit-checked both branches with m