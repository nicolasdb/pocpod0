  story-8-7-team-onboarding-doc: in-progress  # 2026-08-03: Tasks 1-3 done (docs/team-onboarding.md drafted, model/walkthrough/limits sections written). HALTED before Task 4 - needs a real second person + Nicolas live to walk the page (cannot be simulated). 2026-08-02: DRAFTED after a design session that resolved the coordination/identity question deferred from 8.5. Nicolas reframed the connector as the "first line of conscious INPUT" (deliberate externalization into your own pod) vs the ambient/observed input the xAPI pipeline handles - different provenance class, different consent texture. He then traced a concrete multi-layer school scenario (student captures course notes -> school_AGENT reads under a grant made at registration -> region reads only school-computed aggregates) which settled the model AND validated the 8.5 Task 6.1 uniqueness guard against real usage rather than assumption. SETTLED, now architecture.md BP-6: (1) INVARIANT - nobody overwrites your pod but your own AGENT; everything else is a grant you hold on someone else's pod, auditable and revocable by them. One deliberate exception: acl:Append-only mailboxes (Append != Write - add an entry, cannot read others, cannot modify or delete). (2) THREE IDENTITY CLASSES - personal agent (one human, capture, own pod only), collective service agent (nobody holds it, runs as cron, own collective pods only), role-assigned control (directeur held by whoever is currently assigned). The original "shared butler WebID vs per-person agents" framing was a FALSE DICHOTOMY: both exist, different jobs; only shared-credential-across-multiple-humans is ruled out. (3) ROLES ARE NAMED GRANT BUNDLES, not identities - succession reassigns Control, no credential moves. (4) WHAT SCALES IS GRANTS, NOT CREDENTIALS. Nicolas correctly pushed back on my "attribution dead" claim: read attribution was never in question (log pairs reader identity + resource owner), and write attribution is moot because a collective agent never write