services:
  community-solid-server:
    image: solidproject/community-server:7
    container_name: community-solid-server
    ports:
      - "${CSS_PORT:-3000}:3000"
    volumes:
      - css-data:/data
      - ./infra/css/config.json:/config.json:ro${VOLUME_FLAGS:-}
      - ./backoffice:/backoffice:ro${VOLUME_FLAGS:-}
      # Story 7.2: restyle CSS's own identity pages (login/register/consent) to the
      # backoffice design system by overriding the shared stylesheet + page chrome.
      - ./infra/css/main.css:/community-server/templates/styles/main.css:ro${VOLUME_FLAGS:-}
      - ./infra/css/main.html.ejs:/community-server/templates/main.html.ejs:ro${VOLUME_FLAGS:-}
    command:
      - "-p"
      - "3000"
      - "-f"
      - "/data"
      - "-c"
      - "/config.json"
      - "--baseUrl"
      - "${CSS_BASE_URL:-http://localhost:3000}/"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const n=require('net');const c=n.createConnection(3000,'localhost');c.on('connect',()=>{c.end();process.exit(0)});c.on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - default
      - gateway

  oxigraph:
    image: ghcr.io/oxigraph/oxigraph:0.5.6
    container_name: oxigraph
    ports:
      - "${OXIGRAPH_PORT:-7878}:7878"
    volumes:
      - oxigraph-data:/data
    command: serve --location /data --bind 0.0.0.0:7878
    healthcheck:
      test: ["NONE"]

  qdrant:
    image: qdrant/qdrant:v1.17.0
    container_name: qdrant
    ports:
      - "${QDRANT_REST_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/6333"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

networks:
  default: {}
  gateway:
    external: true  # shared with nginx-gateway (hetzner-gateway repo)

volumes:
  css-data:
    driver: local
  oxigraph-data:
    driver: local
  qdrant-data:
    driver: local
