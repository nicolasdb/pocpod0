services:
  # pod.nicolasdb.eu (CSS) and its MCP connector left this compose on the
  # cutover to solid-css-overlay's image (docs/handoff-pocpod0.md there): they
  # run from /srv/nicolasdb-pods (containers nicolasdb-pods-css and
  # nicolasdb-pods-mcp-connector, volumes nicolasdb-pods_*), with their look in
  # nicolasdb/design-system. Qdrant was retired at the same time. What stays
  # here is pocpod0's own: oxigraph, which the connector still queries.

  oxigraph:
    image: ghcr.io/oxigraph/oxigraph:0.5.6
    container_name: oxigraph
    restart: unless-stopped
    ports:
      # Loopback only: Oxigraph has no access control, and /update writes.
      # The connector reaches it as http://oxigraph:7878 on the gateway
      # network; host-side pipeline scripts through this port.
      - "127.0.0.1:${OXIGRAPH_PORT:-7878}:7878"
    volumes:
      - oxigraph-data:/data
    command: serve --location /data --bind 0.0.0.0:7878
    healthcheck:
      test: ["NONE"]
    # The connector (nicolasdb-pods-mcp-connector, another compose project)
    # reaches it as http://oxigraph:7878 over the gateway network. It has no
    # access control: never give it a vhost.
    networks:
      - default
      - gateway

networks:
  default: {}
  gateway:
    external: true  # shared with nginx-gateway (hetzner-gateway repo)

volumes:
  oxigraph-data:
    driver: local
