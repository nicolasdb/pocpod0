services:
  community-solid-server:
    image: solidproject/community-server:7
    container_name: community-solid-server
    ports:
      - "${CSS_PORT:-3000}:3000"
    volumes:
      - css-data:/data
      - ./infra/css/config.json:/config.json:ro${VOLUME_FLAGS:-}
    command:
      - "-p"
      - "3000"
      - "-f"
      - "/data"
      - "-c"
      - "/config.json"
      - "--baseUrl"
      - "http://localhost:3000/"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const n=require('net');const c=n.createConnection(3000,'localhost');c.on('connect',()=>{c.end();process.exit(0)});c.on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  oxigraph:
    image: ghcr.io/oxigraph/oxigraph:0.5.6
    container_name: oxigraph
    ports:
      - "${OXIGRAPH_PORT:-7878}:7878"
    volumes:
      - oxigraph-data:/data
    command: serve --location /data --bind 0.0.0.0:7878
    healthcheck:
      test: ["NONE"]

  qdrant:
    image: qdrant/qdrant:v1.17.0
    container_name: qdrant
    ports:
      - "${QDRANT_REST_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/6333"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  nginx:
    image: nginx:1.28.2-alpine
    container_name: nginx
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
      - "${NGINX_HTTPS_PORT:-8443}:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro${VOLUME_FLAGS:-}
    depends_on:
      community-solid-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:80/nginx-health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  openclaw-gateway:
    build:
      context: .
      dockerfile: infra/openclaw/Dockerfile
      args:
        OPENCLAW_IMAGE: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:latest}
    image: pocpod0-openclaw:latest
    depends_on:
      community-solid-server:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      oxigraph:
        condition: service_started
    container_name: openclaw-gateway
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - HOME=/home/node
      - NODE_ENV=production
      - TERM=xterm-256color
      - OPENCLAW_GATEWAY_BIND=${OPENCLAW_GATEWAY_BIND:-all}
      - OPENCLAW_GATEWAY_PORT=${OPENCLAW_GATEWAY_PORT:-18789}
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN}
      - GOG_KEYRING_PASSWORD=${GOG_KEYRING_PASSWORD}
      - XDG_CONFIG_HOME=/home/node/.openclaw
      - PATH=/home/linuxbrew/.linuxbrew/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      # POCPOD0_ROOT: tells acl-manage/handler.py where pipeline/src and infra/ live in the container.
      # handler.py falls back to 4-level parent of __file__ (correct for dev, wrong inside container).
      - POCPOD0_ROOT=/app
    volumes:
      # openclaw.json bind-mount: config is always deployed fresh from repo (not evolvable)
      - ./agents/openclaw.json:/tmp/openclaw.json:ro${VOLUME_FLAGS:-}
      # Named volume: holds seeded and evolved agent workspaces.
      # Factory reset: docker-compose down -v && docker-compose up
      # Scenario isolation: duplicate this service block with a different volume name.
      - openclaw-data-default:/home/node/.openclaw
    ports:
      - "127.0.0.1:${OPENCLAW_GATEWAY_PORT:-18789}:18789"
    entrypoint: ["/app/entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const n=require('net');const c=n.createConnection(18789,'localhost');c.on('connect',()=>{c.end();process.exit(0)});c.on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # One-shot CLI service for gateway management (device pairing, dashboard URLs).
  # Requires image rebuild: distrobox-host-exec podman compose build openclaw-gateway
  #
  # Usage (from distrobox):
  #   distrobox-host-exec podman compose --profile cli run --rm openclaw-cli devices list
  #   distrobox-host-exec podman compose --profile cli run --rm openclaw-cli devices approve <requestId>
  #   distrobox-host-exec podman compose --profile cli run --rm openclaw-cli dashboard --no-open
  #
  # cli.sh auto-injects --url ws://127.0.0.1:18789 --token $OPENCLAW_GATEWAY_TOKEN.
  # Uses network_mode:service:openclaw-gateway (shared network namespace) so loopback resolves
  # to the gateway — no break-glass OPENCLAW_ALLOW_INSECURE_PRIVATE_WS needed.
  openclaw-cli:
    image: pocpod0-openclaw:latest
    profiles: [cli]
    env_file:
      - .env
    environment:
      - HOME=/home/node
      - XDG_CONFIG_HOME=/home/node/.openclaw
      - PATH=/home/linuxbrew/.linuxbrew/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      - openclaw-data-default:/home/node/.openclaw
    # Share gateway network namespace: CLI connects via ws://127.0.0.1 (loopback) instead of
    # ws://openclaw-gateway (non-loopback, would require OPENCLAW_ALLOW_INSECURE_PRIVATE_WS break-glass).
    # Requires gateway --bind all so it listens on loopback in addition to eth0.
    network_mode: "service:openclaw-gateway"
    depends_on:
      openclaw-gateway:
        condition: service_healthy
    entrypoint: ["/app/cli.sh"]
    user: node

volumes:
  css-data:
    driver: local
  oxigraph-data:
    driver: local
  qdrant-data:
    driver: local
  # Scenario-isolated workspace volume for OpenClaw agents.
  # To add scenario B: duplicate openclaw-gateway service block with openclaw-data-scenario-b.
  # For PoC a single default scenario is sufficient.
  openclaw-data-default:
    driver: local
