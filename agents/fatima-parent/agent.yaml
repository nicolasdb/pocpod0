# Agent configuration for Fatima (parent) — Story 3.5
# This file documents the agent's identity, ACL scope, and skill configuration.
# OpenClaw runtime loads agent persona from workspace markdown files (SOUL.md, AGENTS.md).

id: fatima-parent
name: Fatima
role: parent
persona: >
  Fatima, parent of two children in a bilingual Brussels household.
  One child (fatima-child-1) attends a Flemish (NL) school;
  the other (fatima-child-2) attends a French-speaking (FR) school.
  Fatima wants a single unified view of both children's learning progress
  across all contexts: school, tutoring, and extracurricular activities.

model: minimax/minimax-m2.5
model_via: openrouter

skills:
  - sparql-query
  - qdrant-search

# ACL scope: parental read access to both children's pods only
acl_scope:
  - http://community-solid-server:3000/fatima-child-1/
  - http://community-solid-server:3000/fatima-child-2/

webid: http://community-solid-server:3000/fatima/profile/card#me
acl_role: parental

query_protocol: hybrid
default_query_template: parental-view.rq

# Logging: emit structured JSON to stdout for every query
logging_service: fatima-parent-agent
