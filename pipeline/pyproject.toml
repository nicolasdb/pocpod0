[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pocpod0-pipeline"
version = "0.1.0"
description = "Data ingestion and processing pipeline for pocpod0"
requires-python = ">=3.12"
license = {text = "See LICENSE"}
authors = [
    {name = "Nicolas", email = "nicolas@example.com"}
]

dependencies = [
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "rdflib>=7.0",
    "pydantic>=2.0",
    "qdrant-client>=1.9.0",
    "httpx>=0.27.0",
    "tqdm>=4.66.0",
    "rich>=13.0",
    "textual>=6.6.0",
    "fastapi[standard]>=0.111",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
pocpod0-ingest = "pocpod0_pipeline.ingest:main"
pocpod0-generate-scenarios = "pocpod0_pipeline.generate_scenarios:main"
pocpod0-generate-troll = "pocpod0_pipeline.generate_troll_load:main"
pocpod0-load-graph = "pocpod0_pipeline.load_graph:main"
pocpod0-embed = "pocpod0_pipeline.embed:main"
pocpod0-compare = "pocpod0_pipeline.compare_query_modes:main"
pocpod0-dashboard = "pocpod0_pipeline.pipeline_dashboard:main"
pocpod0-mission-control = "pocpod0_pipeline.mission_control:main"
pocpod0-acl-dashboard = "pocpod0_pipeline.dashboard_api:main"

[tool.setuptools]
packages = ["pocpod0_pipeline"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"
