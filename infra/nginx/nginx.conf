user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    # Upstream to Community Solid Server
    upstream community_solid_server {
        server community-solid-server:3000;
    }

    # HTTP server block
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # Nginx health check — responds 200 without hitting upstream
        location /nginx-health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        location / {
            proxy_pass http://community_solid_server;
            proxy_http_version 1.1;

            # Pass through headers for proper routing
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # CRITICAL: Pass through Accept header for CSS content negotiation
            # CSS 7 handles content negotiation natively (Turtle, JSON-LD, N-Triples)
            proxy_set_header Accept $http_accept;

            # Support for WebSocket and long-lived connections
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Preserve all Solid-specific response headers required by LDP/Solid spec
            # These headers contain authorization, resource type, and method info
            proxy_pass_header Link;
            proxy_pass_header WAC-Allow;
            proxy_pass_header Accept-Patch;
            proxy_pass_header Accept-Post;
            proxy_pass_header Accept-Put;
            proxy_pass_header Allow;
            proxy_pass_header ETag;
            proxy_pass_header Last-Modified;
            proxy_pass_header Vary;
            proxy_pass_header MS-Author-Via;

            # Buffering settings
            proxy_buffering off;
            proxy_request_buffering off;
        }
    }

    # HTTPS configuration placeholder for future use
    # Uncomment and configure when SSL certificates are available
    #
    # server {
    #     listen 443 ssl http2 default_server;
    #     listen [::]:443 ssl http2 default_server;
    #     server_name _;
    #
    #     ssl_certificate /etc/nginx/ssl/cert.pem;
    #     ssl_certificate_key /etc/nginx/ssl/key.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
